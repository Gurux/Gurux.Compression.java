name: Publish to Maven Central

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: maven-central-release
  cancel-in-progress: false
  queue: max

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main branch and all release tags
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Java and Maven Central credentials
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD

      - name: Check version selection
        run: node --test .github/scripts/next-release.test.mjs

      - name: Select the next patch version or resume this run
        shell: bash
        run: |
          set -euo pipefail
          existing=$(git log --format=%H --grep="^Release-Run: $GITHUB_RUN_ID$" -1)
          if [[ -n "$existing" ]]; then
            git switch --detach "$existing"
            version=$(node .github/scripts/next-release.mjs --current)
            tag="v$version"
            if [[ "$(git rev-parse "refs/tags/$tag^{commit}")" != "$existing" ]]; then
              echo '::error::Existing release tag does not match the release commit.'
              exit 1
            fi
            echo 'RELEASE_RECORDED=true' >> "$GITHUB_ENV"
          else
            version=$(node .github/scripts/next-release.mjs)
            tag="v$version"
            mvn --batch-mode --no-transfer-progress \
              org.codehaus.mojo:versions-maven-plugin:2.25.3:set \
              -DnewVersion="$version" -DgenerateBackupPoms=false
            mvn --batch-mode --no-transfer-progress \
              org.codehaus.mojo:versions-maven-plugin:2.25.3:set-property \
              -Dproperty=scm.tag -DnewVersion="$tag" -DgenerateBackupPoms=false
            echo 'RELEASE_RECORDED=false' >> "$GITHUB_ENV"
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Build and sign release artifacts
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        shell: bash
        run: |
          set -euo pipefail
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_KEY MAVEN_GPG_PASSPHRASE; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing repository secret: $name"
              exit 1
            fi
          done
          mvn --batch-mode --no-transfer-progress -Preleases clean verify

      - name: Commit version and push release tag atomically
        if: env.RELEASE_RECORDED != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pom.xml
          git commit -m "chore(release): $RELEASE_VERSION" -m "Release-Run: $GITHUB_RUN_ID"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_VERSION"
          # Abort before deploying if main changed or branch rules reject the push.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/$RELEASE_TAG"

      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn --batch-mode --no-transfer-progress -Preleases deploy
